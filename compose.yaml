services:
  postgres:
    image: postgres:16-alpine
    container_name: pkrassistant-db
    environment:
      - POSTGRES_DB=pkrassistant
      - POSTGRES_USER=akolodka
      - POSTGRES_PASSWORD=mystrongpassword123!  
    ports:
      # Хост:Контейнер
      - "5432:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: